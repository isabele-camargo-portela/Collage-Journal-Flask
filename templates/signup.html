{% extends "base.html" %}

{% block title %}
Collage-journal | Sign Up
{% endblock %}

{% block content %}

<main class="sign-up">
    <section id="cadastro">
        <h3>Crie sua conta</h3>
        <img src="{{ url_for('static', filename='img/jazmin-quaynor-bm9zWKi_c9Y-unsplash.jpg') }}">
        <form class="cadastro">
            <div class="nome">
                <label for="nome">Nome</label>
                <input type="text" name="nome" placeholder="Nome" required>
            </div>
            <div class="email">
                <label for="email">Email</label>
                <input type="text" name="email" placeholder="Email@.com" required>
            </div>
            <div class="senha">
                <div>
                    <label for="senha">Senha</label>
                    <input type="password" name="senha" placeholder="Confirme a senha" required>
                </div>
                <div>
                    <label>Confirmar senha</label>
                    <input type="password" name="senha" placeholder="Confirme a senha" required>
                </div>
            </div>
            <div class="bio">
                <label for="bio">Bio</label>
                <textarea type="textarea" nmae="bio" rows="10" placeholder="Fale um pouco sobre você..."></textarea>
            </form>
            <button type="submit">Cadastrar</button>
        </form>
    </section>
</main>

{% endblock %}

{% block scripts %}

    <script src="{{ url_for('static', filename='js/signin.js') }}"></script>

{% endblock %}
